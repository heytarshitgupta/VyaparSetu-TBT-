services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vyaparsetu_ai
      POSTGRES_PASSWORD: "vy1fyUwuCasEXkaUiJHFkorujaiG1v2m"
    volumes:
      - vyaparsetu_ai_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "z0jP2AWVvLrnsScVBkDhO3xTZ1bDup8g"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vyaparsetu_ai_test
      POSTGRES_PASSWORD: "7DI6WxpyIii2vA3ptF3GNdeEkoMUf__0"
    volumes:
      - vyaparsetu_ai_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "OWELGHKVrILBL8yMZ5TCHkq1fT30oi_C"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vyaparsetu_ai_data:
  vyaparsetu_ai_test_data:
