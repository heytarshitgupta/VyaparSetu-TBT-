services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vyaparsetu_ai
      POSTGRES_PASSWORD: "${VYAPARSETU_DEV_DB_PASSWORD:-}"
    volumes:
      - vyaparsetu_ai_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:8091:6379"
    command: redis-server --requirepass "${VYAPARSETU_DEV_REDIS_PASSWORD:-}"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vyaparsetu_ai_test
      POSTGRES_PASSWORD: "${VYAPARSETU_TEST_DB_PASSWORD:-}"
    volumes:
      - vyaparsetu_ai_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:9091:6379"
    command: redis-server --requirepass "${VYAPARSETU_TEST_REDIS_PASSWORD:-}"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  vyaparsetu_ai_data:
  vyaparsetu_ai_test_data:
