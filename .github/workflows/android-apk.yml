name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ vars.SERVER_URL || 'https://vyaparsetu.api.serverpod.space/' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: vyaparsetu_ai
        run: flutter pub get

      - name: Build release APK
        working-directory: vyaparsetu_ai/vyaparsetu_ai_flutter
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SERVER_URL="$SERVER_URL"
          cp build/app/outputs/flutter-apk/app-release.apk vyaparsetu.apk

      - name: Publish latest APK
        working-directory: vyaparsetu_ai/vyaparsetu_ai_flutter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Latest VyaparSetu APK — ${GITHUB_SHA::7} (build ${{ github.run_number }})
          API: ${SERVER_URL}"
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "Latest APK" --notes "$NOTES" --latest
            gh release upload apk-latest vyaparsetu.apk --clobber
          else
            gh release create apk-latest vyaparsetu.apk \
              --title "Latest APK" --notes "$NOTES" --latest
          fi

      - name: Summary
        run: |
          echo "### Latest APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/latest/download/vyaparsetu.apk" >> "$GITHUB_STEP_SUMMARY"
